name: easyget_customer_app
description: EASYGET customer mobile application.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State management (Riverpod 3 — Notifier/AsyncNotifier, no codegen)
  flutter_riverpod: ^3.0.0
  # Navigation with custom transitions
  go_router: ^17.0.0
  # Networking
  dio: ^5.7.0
  # Token storage (Keychain / Keystore)
  flutter_secure_storage: ^10.0.0
  # Image caching + placeholders
  cached_network_image: ^3.4.1
  # Currency / date formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
