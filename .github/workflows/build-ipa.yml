name: Build customer app IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "iOS export method (used when signing secrets are configured)"
        required: false
        default: "ad-hoc"
        type: choice
        options:
          - ad-hoc
          - app-store
          - development
          - enterprise
  push:
    branches: [ "main" ]
    paths:
      - "customer-app-v2/**"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: customer-app-v2
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"
          channel: stable
          cache: true

      - name: Provide Firebase iOS config (optional)
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Check signing secrets
        id: signing
        env:
          CERT_B64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASS: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$CERT_B64" ] && [ -n "$P12_PASS" ] && [ -n "$PROFILE_B64" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Apple signing certificate & provisioning profile
        if: steps.signing.outputs.signed == 'true'
        env:
          CERT_B64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASS: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASS: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build_pp.mobileprovision"

          echo -n "$CERT_B64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROFILE_B64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "${KEYCHAIN_PASS:-temp}" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "${KEYCHAIN_PASS:-temp}" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$P12_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASS:-temp}" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build signed IPA
        if: steps.signing.outputs.signed == 'true'
        run: |
          EXPORT_METHOD="${{ inputs.export_method || 'ad-hoc' }}"
          flutter build ipa --release --export-method="$EXPORT_METHOD"
          mkdir -p build/ipa-output
          cp build/ios/ipa/*.ipa build/ipa-output/

      - name: Build unsigned IPA (no signing secrets configured)
        if: steps.signing.outputs.signed != 'true'
        run: |
          flutter build ios --release --no-codesign
          mkdir -p build/ipa-output Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qry build/ipa-output/easyget-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-v2-ipa
          path: customer-app-v2/build/ipa-output/*.ipa
          retention-days: 14

      - name: Clean up keychain
        if: always() && steps.signing.outputs.signed == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
