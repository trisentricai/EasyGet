name: Deploy frontends to Netlify

on:
  push:
    branches: [fix/flutter-web-and-ordering, main]
    paths:
      - "customer-web/**"
      - "admin-web/**"
      - ".github/workflows/deploy-netlify.yml"
  workflow_dispatch:

concurrency:
  group: deploy-netlify
  cancel-in-progress: false

env:
  VITE_API_URL: https://easyget-api.onrender.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            customer-web/package-lock.json
            admin-web/package-lock.json

      - name: Build customer-web
        working-directory: customer-web
        run: npm ci && npm run build

      - name: Build admin-web
        working-directory: admin-web
        run: npm ci && npm run build

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          CUSTOMER_SITE_ID: ${{ secrets.NETLIFY_CUSTOMER_SITE_ID }}
          ADMIN_SITE_ID: ${{ secrets.NETLIFY_ADMIN_SITE_ID }}
        run: |
          set -euo pipefail
          deploy() {
            local dir="$1" site="$2" name="$3" resp id state=""
            (cd "$dir/dist" && zip -qr "../$name.zip" .)
            resp=$(curl -sS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              -H "Content-Type: application/zip" \
              --data-binary @"$dir/$name.zip" \
              "https://api.netlify.com/api/v1/sites/$site/deploys")
            id=$(echo "$resp" | jq -r '.id // empty')
            if [ -z "$id" ]; then echo "::error::Upload failed for $name: $resp"; exit 1; fi
            for _ in $(seq 1 45); do
              state=$(curl -sS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
                "https://api.netlify.com/api/v1/deploys/$id" | jq -r '.state')
              case "$state" in
                ready) break ;;
                error|failed) echo "::error::$name deploy errored"; exit 1 ;;
              esac
              sleep 2
            done
            if [ "$state" != "ready" ]; then echo "::error::$name not ready ($state)"; exit 1; fi
            curl -sS -X POST -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/deploys/$id/restore" > /dev/null
            echo "$name deployed: https://$(curl -sS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites/$site" | jq -r '.ssl_url')"
          }
          deploy customer-web "$CUSTOMER_SITE_ID" customer
          deploy admin-web "$ADMIN_SITE_ID" admin
